<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nóminas{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%231d6f4f'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='white' font-family='sans-serif'>€</text></svg>">
</head>
<body>
{% if usuario %}
<header class="top">
  <a class="brand" href="/"><span class="dot"></span>Nóminas</a>
  <nav>
    {% set p = request.url.path %}
    <a href="/" class="{{ 'on' if p == '/' }}">Panel</a>
    <a href="/subir" class="{{ 'on' if p == '/subir' }}">Subir PDF</a>
    <a href="/nueva" class="{{ 'on' if p == '/nueva' }}">Entrada manual</a>
  </nav>
  <form method="post" action="/logout"><button class="btn link small">Salir</button></form>
</header>
{% endif %}
<main>
{% block body %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
